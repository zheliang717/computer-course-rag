[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-course-rag"
version = "0.30.57"
description = "RAG question answering system for computer science courses"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=43,<50",
  "fastapi==0.141.1",
  "httpx>=0.27,<1",
  "pgvector>=0.3,<1",
  "Pillow==13.0.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "pymupdf>=1.24,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=3.0,<6"]
dev = ["pytest>=8,<9"]
collection = ["beautifulsoup4>=4.12,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
