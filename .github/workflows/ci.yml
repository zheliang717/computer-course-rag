name: quality-gate

on:
  push:
  pull_request:

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_full_tests_20261028
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Prepare explicitly isolated databases
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://rag:rag@127.0.0.1:5432/postgres', autocommit=True) as c:
              c.execute('CREATE DATABASE rag_today_concurrency_20261028')
              c.execute('CREATE DATABASE rag_today_dev_20261028')
          for name in ['rag_full_tests_20261028','rag_today_concurrency_20261028','rag_today_dev_20261028']:
              with psycopg.connect('postgresql://rag:rag@127.0.0.1:5432/'+name, autocommit=True) as c:
                  c.execute('CREATE EXTENSION IF NOT EXISTS vector')
          PY
      - run: pytest -q --junitxml=reports/ci-backend.xml
        env:
          STORAGE_BACKEND: memory
          EMBEDDING_PROVIDER: hashing
          LLM_PROVIDER: offline
          AUTH_REQUIRED: "false"
          DATABASE_URL: postgresql+psycopg://rag:rag@127.0.0.1:5432/rag_full_tests_20261028
          FULL_TEST_DATABASE_URL: postgresql+psycopg://rag:rag@127.0.0.1:5432/rag_full_tests_20261028
          ACCOUNT_TEST_DATABASE_URL: postgresql+psycopg://rag:rag@127.0.0.1:5432/rag_today_concurrency_20261028
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated browser services
        env:
          DATABASE_URL: postgresql+psycopg://rag:rag@127.0.0.1:5432/rag_today_dev_20261028
          STORAGE_BACKEND: postgres
          EMBEDDING_PROVIDER: hashing
          LLM_PROVIDER: offline
          AUTH_REQUIRED: "true"
          AUTH_SECRET: ci-disposable-authentication-secret-20261029
        run: |
          mkdir -p reports
          alembic upgrade head > reports/ci-migration.log 2>&1
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18084 > reports/ci-api.log 2>&1 &
          API_UPSTREAM_HOST=127.0.0.1 API_UPSTREAM_PORT=18084 PORT=18086 python frontend/server.py > reports/ci-web.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:18086/health && exit 0; sleep 1; done
          exit 1
      - name: Browser workflow checks
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:18086
          E2E_DATABASE: rag_today_dev_20261028
          PLAYWRIGHT_JSON_OUTPUT_NAME: ../reports/ci-browser.json
        run: npm run test:e2e:direct -- remediation.spec.ts --project=chrome-desktop --reporter=json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-quality-evidence
          path: |
            reports/ci-*
            frontend/test-results
